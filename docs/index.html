<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budgie — Monthly Budget</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0f5c55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budgie">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --bg:#f5f3ee; --surface:#ffffff; --surface-2:#efece5; --surface-3:#e6e2d8;
    --ink:#1b211f; --ink-soft:#56605b; --ink-faint:#8a918c; --line:#e3dfd5;
    --accent:#0f766e; --accent-strong:#0f5c55; --accent-soft:#dff0ec; --on-accent:#ffffff;
    --ok:#0f8a6e; --warn:#d98a00; --warn-soft:#fbefd5; --warn-ink:#8a5600;
    --over:#d03b3b; --over-soft:#fbe3e1; --over-ink:#9b2323;
    --good-ink:#006b45;
    --track:#ebe7de; --pace:#1b211f;
    --series-1:#2a78d6; --series-muted:#b4b1a8; --grid:#e8e5dc;
    --shadow:0 1px 2px rgba(24,32,28,.05), 0 8px 24px -16px rgba(24,32,28,.25);
    --shadow-lg:0 20px 60px -20px rgba(0,0,0,.35);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --r:18px; --fs:15px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#111514; --surface:#1a201e; --surface-2:#232a28; --surface-3:#2c3431;
      --ink:#eef2f0; --ink-soft:#aab4af; --ink-faint:#76807b; --line:#2e3633;
      --accent:#2fb5a5; --accent-strong:#5fd0c1; --accent-soft:#16312d; --on-accent:#06201c;
      --ok:#2fb58f; --warn:#f0a52a; --warn-soft:#3a2c12; --warn-ink:#f7c56a;
      --over:#ec6a63; --over-soft:#3d1f1d; --over-ink:#f6aaa4;
      --good-ink:#4fd39f;
      --track:#2a3230; --pace:#eef2f0;
      --series-1:#3987e5; --series-muted:#5f6662; --grid:#28302d;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#111514; --surface:#1a201e; --surface-2:#232a28; --surface-3:#2c3431;
    --ink:#eef2f0; --ink-soft:#aab4af; --ink-faint:#76807b; --line:#2e3633;
    --accent:#2fb5a5; --accent-strong:#5fd0c1; --accent-soft:#16312d; --on-accent:#06201c;
    --ok:#2fb58f; --warn:#f0a52a; --warn-soft:#3a2c12; --warn-ink:#f7c56a;
    --over:#ec6a63; --over-soft:#3d1f1d; --over-ink:#f6aaa4;
    --good-ink:#4fd39f;
    --track:#2a3230; --pace:#eef2f0;
    --series-1:#3987e5; --series-muted:#5f6662; --grid:#28302d;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }
  /* Easy view (for parents): bigger type, fewer details. Per device. */
  body.simple{ --fs:18px; }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* `hidden` must always win over an element's own display rule. */
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:var(--fs); line-height:1.45; -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
    overflow:hidden;
  }
  button,input,select,textarea{font:inherit; color:inherit;}
  button{cursor:pointer;}
  input,select,textarea{
    width:100%; background:var(--surface-2); border:1.5px solid transparent; border-radius:12px;
    padding:11px 13px; outline:none; font-size:16px;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent); background:var(--surface);}
  textarea{resize:vertical; min-height:90px;}
  label.field{display:flex; flex-direction:column; gap:6px; font-size:.82em; font-weight:600; color:var(--ink-soft);}
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- App shell (flex column; only <main> scrolls; nav is NOT fixed) ---------- */
  #app{
    margin-inline:auto; max-width:560px;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .col{flex:1; min-height:0; display:flex; flex-direction:column;}
  header.top{
    flex-shrink:0; padding:calc(10px + var(--safe-t)) 16px 8px;
    display:flex; align-items:center; gap:8px;
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.05em; letter-spacing:-.01em; margin-right:auto;}
  .brand img{width:28px; height:28px; border-radius:8px;}
  .icon-btn{
    width:40px; height:40px; border-radius:12px; border:none; background:transparent; color:var(--ink-soft);
    display:inline-flex; align-items:center; justify-content:center; position:relative;
  }
  .icon-btn:hover{background:var(--surface-2);}
  .sync-dot{position:absolute; top:9px; right:9px; width:8px; height:8px; border-radius:50%; background:var(--ink-faint); border:2px solid var(--bg);}
  .sync-dot.ok{background:var(--ok);} .sync-dot.err{background:var(--over);} .sync-dot.busy{background:var(--warn); animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.4}}

  .monthbar{display:flex; align-items:center; justify-content:center; gap:4px; padding:0 16px 6px; flex-shrink:0;}
  .monthbar .lbl{min-width:170px; text-align:center;}
  .monthbar .lbl b{display:block; font-size:1.02em;}
  .monthbar .lbl span{display:block; font-size:.74em; color:var(--ink-faint);}

  main{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 16px calc(28px + var(--safe-b));}
  .panel{display:none; flex-direction:column; gap:14px;}
  .panel.active{display:flex;}

  nav.tabbar{
    flex-shrink:0; background:var(--surface); border-top:1px solid var(--line);
    padding:6px 8px calc(6px + var(--safe-b));
  }
  nav.tabbar .inner{display:flex; align-items:center; gap:2px; max-width:520px; margin:auto;}
  nav.tabbar .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none;
    padding:6px 2px; color:var(--ink-faint); font-size:11px; font-weight:650; border-radius:12px; position:relative;
  }
  nav.tabbar .tab-btn.active{color:var(--accent-strong);}
  nav.tabbar .tab-btn .badge{position:absolute; top:2px; left:calc(50% + 6px);}
  .add-btn{
    width:54px; height:54px; border-radius:18px; border:none; margin:0 6px; flex-shrink:0;
    background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px -8px var(--accent);
  }
  .add-btn:active{transform:scale(.96);}

  /* Laptop: nav becomes a sidebar, content gets two columns */
  @media (min-width:900px){
    #app{max-width:1200px; flex-direction:row;}
    nav.tabbar{order:-1; width:220px; border-top:none; border-right:1px solid var(--line); padding:20px 12px; background:transparent;}
    nav.tabbar .inner{flex-direction:column; align-items:stretch; gap:4px;}
    nav.tabbar .tab-btn{flex:none; flex-direction:row; gap:12px; font-size:14.5px; padding:11px 14px; justify-content:flex-start;}
    nav.tabbar .tab-btn.active{background:var(--accent-soft);}
    nav.tabbar .tab-btn .badge{position:static; margin-left:auto;}
    .add-btn{order:-1; width:100%; height:46px; border-radius:14px; margin:0 0 14px; gap:8px; font-weight:700;}
    .add-btn::after{content:"Add transaction";}
    .side-brand{display:flex !important;}
    header.top .brand{visibility:hidden;}
    main{padding:8px 28px 40px;}
    .grid-2{display:grid !important; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:16px; align-items:start;}
    .grid-2 > div{display:flex; flex-direction:column; gap:14px;}
  }
  .side-brand{display:none; align-items:center; gap:10px; font-weight:800; font-size:18px; padding:4px 8px 22px;}
  .side-brand img{width:32px; height:32px; border-radius:9px;}
  .grid-2{display:flex; flex-direction:column; gap:14px;}
  .grid-2 > div{display:flex; flex-direction:column; gap:14px;}

  /* ---------- Building blocks ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow);}
  .card.flat{box-shadow:none;}
  .card-h{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px;}
  .card-h h3{margin:0; font-size:.95em; font-weight:750;}
  .muted{color:var(--ink-soft);} .faint{color:var(--ink-faint);}
  .small{font-size:.82em;} .tiny{font-size:.72em;}
  .eyebrow{font-size:.7em; text-transform:uppercase; letter-spacing:.09em; font-weight:750; color:var(--ink-faint);}
  .link{background:none; border:none; color:var(--accent-strong); font-weight:650; padding:4px 2px; font-size:.86em;}
  .row{display:flex; align-items:center; gap:10px;}
  .spacer{flex:1;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .wrap{flex-wrap:wrap;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:13px; border:none;
    padding:12px 16px; font-size:.95em; font-weight:700; background:var(--surface-2); color:var(--ink);
  }
  .btn.primary{background:var(--accent); color:var(--on-accent);}
  .btn.danger{background:var(--over-soft); color:var(--over-ink);}
  .btn.block{width:100%;}
  .btn.sm{padding:8px 12px; font-size:.82em; border-radius:10px;}
  .btn[disabled]{opacity:.45; pointer-events:none;}
  .btn:active{transform:scale(.98);}

  .badge{min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--over); color:#fff; font-size:11px; font-weight:800; display:inline-flex; align-items:center; justify-content:center;}

  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px;
    background:var(--surface-2); border:1.5px solid transparent; font-size:.86em; font-weight:600; white-space:nowrap;
  }
  .chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong);}
  .chip.suggest{border-color:var(--accent); border-style:dashed;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chips.scroll{flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;}
  .chips.scroll::-webkit-scrollbar{display:none;}

  .seg{display:flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:3px;}
  .seg button{flex:1; border:none; background:none; padding:9px 8px; border-radius:10px; font-weight:650; font-size:.88em; color:var(--ink-soft);}
  .seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

  /* ---------- Hero ---------- */
  .hero{background:linear-gradient(160deg,var(--accent-strong),var(--accent)); color:#fff; border:none; padding:18px 18px 16px;}
  :root[data-theme="dark"] .hero{background:linear-gradient(160deg,#134a45,#0f3b37);}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hero{background:linear-gradient(160deg,#134a45,#0f3b37);} }
  .hero .eyebrow{color:rgba(255,255,255,.75);}
  .hero .big{font-size:2.35em; font-weight:800; letter-spacing:-.03em; line-height:1.1; margin:4px 0 2px;}
  .hero .sub{color:rgba(255,255,255,.85); font-size:.88em;}
  .hero .bar{--track:rgba(255,255,255,.22); --pace:#fff; margin-top:14px; height:12px;}
  .hero .bar .fill{background:#fff;}
  .hero .bar.warn .fill{background:#ffd27a;} .hero .bar.over .fill{background:#ff9d96;}
  .hero-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;}
  .hero-stats div{background:rgba(255,255,255,.12); border-radius:12px; padding:9px 10px;}
  .hero-stats b{display:block; font-size:1.02em;}
  .hero-stats span{font-size:.7em; color:rgba(255,255,255,.8);}
  .pace-note{display:flex; gap:8px; align-items:center; margin-top:12px; font-size:.86em; background:rgba(0,0,0,.14); padding:9px 11px; border-radius:12px;}

  /* ---------- Progress bar with pace marker ---------- */
  .bar{display:block; position:relative; height:10px; border-radius:99px; background:var(--track); overflow:visible;}
  .bar .fill{display:block; position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:var(--ok); transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .bar.warn .fill{background:var(--warn);} .bar.over .fill{background:var(--over);}
  .bar .pace{display:block; position:absolute; top:-3px; bottom:-3px; width:2px; border-radius:2px; background:var(--pace); opacity:.55;}
  .bar.over .fill{border-radius:99px;}

  /* ---------- Category rows ---------- */
  .group-h{display:flex; align-items:baseline; justify-content:space-between; margin:6px 2px 0;}
  .cat{display:flex; gap:12px; align-items:center; padding:12px 4px; border:none; background:none; width:100%; text-align:left; border-radius:14px;}
  .cat:hover{background:var(--surface-2);}
  .cat + .cat{border-top:1px solid var(--line); border-radius:0;}
  .emoji{width:40px; height:40px; border-radius:12px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
  .cat .body{flex:1; min-width:0; display:block;}
  .cat .top{display:flex; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:7px;}
  .cat .name{font-weight:680; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cat .amt{font-size:.86em; white-space:nowrap;}
  .cat .meta{display:flex; justify-content:space-between; gap:8px; margin-top:6px; font-size:.76em; color:var(--ink-faint);}
  .status{display:inline-flex; align-items:center; gap:4px; font-weight:700;}
  .status.ok{color:var(--good-ink);} .status.warn{color:var(--warn-ink);} .status.over{color:var(--over-ink);}

  /* ---------- Review banner ---------- */
  .review-banner{display:flex; align-items:center; gap:12px; background:var(--warn-soft); border:1px solid transparent; color:var(--warn-ink); padding:13px 14px; border-radius:var(--r); width:100%; text-align:left;}
  .review-banner b{display:block; color:var(--ink);}
  .review-banner .emoji{background:rgba(255,255,255,.55);}

  /* ---------- Transactions ---------- */
  .day-h{display:flex; justify-content:space-between; font-size:.76em; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin:14px 4px 4px;}
  .tx{display:flex; align-items:center; gap:12px; padding:10px 6px; border:none; background:none; width:100%; text-align:left; border-radius:12px;}
  .tx:hover{background:var(--surface-2);}
  .tx .body{flex:1; min-width:0; display:block;} .tx .m,.tx .c{display:block;}
  .tx .m{font-weight:640; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx .c{font-size:.78em; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx .a{font-weight:700; white-space:nowrap;}
  .tx .a.in{color:var(--good-ink);}
  .tx .a.tr{color:var(--ink-faint);}
  .pill{font-size:.68em; font-weight:750; padding:2px 7px; border-radius:99px; background:var(--warn-soft); color:var(--warn-ink); margin-left:6px; vertical-align:2px;}
  .pill.src{background:var(--surface-2); color:var(--ink-faint);}

  /* ---------- Stat tiles & charts ---------- */
  .tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
  @media (min-width:900px){ .tiles.four{grid-template-columns:repeat(4,minmax(0,1fr));} }
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px 14px; box-shadow:var(--shadow);}
  .tile .v{font-size:1.35em; font-weight:800; letter-spacing:-.02em; margin:2px 0;}
  .tile .d{font-size:.76em; color:var(--ink-faint);}
  .tiles.three .tile{padding:10px;} .tiles.three .v{font-size:1.02em; white-space:nowrap;} .tiles.three .d{display:none;}
  .delta-up{color:var(--over-ink); font-weight:700;} .delta-down{color:var(--good-ink); font-weight:700;}
  .chart{position:relative; width:100%;}
  .chart svg{display:block; width:100%; height:auto; overflow:visible;}
  .chart .axis{font-size:11px; fill:var(--ink-faint);}
  .tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:12px; padding:7px 9px; border-radius:9px; white-space:nowrap; transform:translate(-50%,-110%); box-shadow:var(--shadow-lg); z-index:3;}
  .tip b{display:block;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.76em; color:var(--ink-soft); margin-bottom:8px;}
  .legend i{display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px;}
  .hbar{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; align-items:center; padding:7px 0;}
  .hbar .t{font-size:.86em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hbar .v{font-size:.82em; font-weight:700; text-align:right;}
  .hbar .track span,.hbar .track em{display:block;} .hbar .track{grid-column:1 / -1; height:8px; background:var(--track); border-radius:99px; position:relative;}
  .hbar .track span{position:absolute; left:0; top:0; bottom:0; background:var(--series-1); border-radius:99px;}
  .hbar .track em{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--pace); opacity:.5;}

  /* ---------- Budget editor ---------- */
  .drop{border:2px dashed var(--line); border-radius:var(--r); padding:22px 16px; text-align:center; background:var(--surface); transition:.15s;}
  .drop.over{border-color:var(--accent); background:var(--accent-soft);}
  .drop .emoji{margin:0 auto 8px; width:52px; height:52px; font-size:26px; background:var(--accent-soft);}
  .plan-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border:none; background:none; width:100%; text-align:left;}
  .plan-row + .plan-row{border-top:1px solid var(--line);}
  .plan-row .n{flex:1; min-width:0; font-weight:620; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .plan-row .v{font-weight:700;}
  .summary-line{display:flex; justify-content:space-between; padding:6px 0; font-size:.92em;}
  .summary-line.total{border-top:1px solid var(--line); margin-top:4px; padding-top:10px; font-weight:800;}

  /* ---------- Sheets (bottom sheet on phone, dialog on laptop) ---------- */
  #sheetWrap{position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  #sheetWrap .backdrop{position:absolute; inset:0; background:rgba(10,14,12,.45); animation:fade .2s;}
  #sheet{
    position:relative; background:var(--surface); width:100%; max-width:560px; max-height:92dvh; overflow-y:auto;
    border-radius:24px 24px 0 0; padding:10px 18px calc(22px + var(--safe-b)); box-shadow:var(--shadow-lg);
    animation:up .28s cubic-bezier(.2,.8,.2,1);
  }
  #sheet .grab{width:40px; height:5px; border-radius:3px; background:var(--surface-3); margin:0 auto 12px;}
  #sheet h2{margin:0 0 4px; font-size:1.2em; letter-spacing:-.01em;}
  .sheet-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
  @media (min-width:700px){
    #sheetWrap{align-items:center;}
    #sheet{border-radius:24px; padding-bottom:22px;}
    #sheet .grab{display:none;}
  }
  @keyframes up{from{transform:translateY(40px); opacity:0}}
  @keyframes fade{from{opacity:0}}
  .sticky-save{position:sticky; bottom:0; z-index:2; box-shadow:0 -10px 20px 6px var(--surface);}
  .amount-input{font-size:2.4em; font-weight:800; text-align:center; background:none; border:none; padding:6px 0; letter-spacing:-.02em;}
  .amount-input:focus{background:none; border:none;}
  .cat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px;}
  .cat-pick{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border-radius:14px; border:1.5px solid transparent; background:var(--surface-2); font-size:.76em; font-weight:620; text-align:center; line-height:1.2;}
  .cat-pick .e{font-size:22px;}
  .cat-pick.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);}
  .cat-pick.suggest{border-color:var(--accent); border-style:dashed;}
  .raw{font-family:ui-monospace,Menlo,monospace; font-size:.74em; background:var(--surface-2); border-radius:10px; padding:9px 11px; color:var(--ink-soft); white-space:pre-wrap; word-break:break-word;}
  .check{display:flex; align-items:center; gap:10px; font-size:.9em;}
  .check input{width:22px; height:22px; accent-color:var(--accent); flex-shrink:0;}
  .imp-table{width:100%; border-collapse:collapse; font-size:.86em;}
  .imp-table td{padding:5px 4px; border-bottom:1px solid var(--line);}
  .imp-table input{padding:7px 9px; border-radius:9px; font-size:14px;}
  .imp-table td.g{color:var(--ink-faint); font-size:.85em;}
  .steps{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px; font-size:.9em;}
  .steps code, .code{font-family:ui-monospace,Menlo,monospace; background:var(--surface-2); padding:2px 6px; border-radius:6px; font-size:.86em; word-break:break-all;}
  .copy-box{display:flex; gap:8px; align-items:center; background:var(--surface-2); border-radius:12px; padding:8px 8px 8px 12px; font-family:ui-monospace,Menlo,monospace; font-size:.8em; word-break:break-all;}
  .copy-box span{flex:1;}

  .empty{text-align:center; padding:28px 16px; color:var(--ink-soft);}
  .empty .emoji{margin:0 auto 10px; width:56px; height:56px; font-size:28px;}

  #toast{position:fixed; left:50%; bottom:calc(96px + var(--safe-b)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:14px; font-size:.88em; font-weight:600; z-index:60; box-shadow:var(--shadow-lg); display:flex; gap:12px; align-items:center; max-width:calc(100% - 32px);}
  #toast button{background:none; border:none; color:var(--accent); font-weight:800; filter:brightness(1.4);}
  #dropOverlay{position:fixed; inset:0; z-index:70; background:rgba(15,118,110,.18); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; pointer-events:none;}
  #dropOverlay div{background:var(--surface); padding:22px 28px; border-radius:20px; font-weight:750; box-shadow:var(--shadow-lg); border:2px dashed var(--accent);}

  #installBanner{
    position:fixed; left:12px; right:12px; bottom:calc(86px + var(--safe-b)); z-index:20; max-width:520px; margin-inline:auto;
    background:var(--ink); color:var(--bg); border-radius:16px; padding:14px 6px 14px 15px; box-shadow:var(--shadow-lg);
    display:flex; gap:8px; align-items:flex-start;
  }
  #installBanner div{flex:1;}
  #installBanner b{display:block; font-size:.9em; margin-bottom:2px;}
  #installBanner p{margin:0; font-size:.82em; opacity:.85; line-height:1.5;}
  #installBanner .close{background:none; border:none; color:inherit; opacity:.8; font-size:22px; width:44px; height:44px; margin:-10px -6px -10px -4px; flex-shrink:0;}

  /* ---------- Statement import ---------- */
  .st-list{max-height:44dvh; overflow:auto; margin:0 -4px; border-top:1px solid var(--line);}
  .st-row{display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); font-size:.86em;}
  .st-row.off{opacity:.45;}
  .st-row input{width:20px; height:20px; accent-color:var(--accent); flex-shrink:0;}
  .st-row .d{width:48px; flex-shrink:0; color:var(--ink-faint); font-size:.9em;}
  .st-row .m{flex:1; min-width:0; display:flex; flex-direction:column;}
  .st-row .m b{font-weight:640; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .st-row .m span{font-size:.85em; color:var(--ink-faint);}
  .st-row .a{font-weight:700; white-space:nowrap;} .st-row .a.in{color:var(--good-ink);}
  /* ---------- Suggestions ---------- */
  .sug{border:1px solid var(--line); border-radius:14px; padding:11px 12px; margin-bottom:8px; background:var(--surface);}
  .sug.off{opacity:.55;}
  .sug-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .toggle{display:flex; align-items:center; gap:6px; font-size:.78em; font-weight:700; color:var(--accent-strong);}
  .toggle input{width:20px; height:20px; accent-color:var(--accent);}
  .recap-card{background:linear-gradient(135deg,#0f5c55,#2a78d6); color:#fff; border:none;}
  /* ---------- Recap story ---------- */
  #story{position:fixed; inset:0; z-index:90; color:#fff; display:flex; flex-direction:column; padding:calc(14px + var(--safe-t)) 22px calc(24px + var(--safe-b)); overflow:hidden; transition:background .4s;}
  .st-bars{display:flex; gap:4px; max-width:520px; width:100%; margin:0 auto;}
  .st-bars i{flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.3); overflow:hidden;}
  .st-bars i b{display:block; height:100%; width:0; background:#fff;}
  .st-bars i.done b{width:100%;}
  .st-bars i.now b{animation:stfill 7s linear forwards;}
  @keyframes stfill{to{width:100%}}
  .st-close{position:absolute; top:calc(26px + var(--safe-t)); right:14px; color:#fff; z-index:3; background:rgba(0,0,0,.15);}
  .st-body{flex:1; display:flex; flex-direction:column; justify-content:center; max-width:520px; width:100%; margin:0 auto; gap:10px; position:relative; z-index:2; pointer-events:none; animation:up .35s;}
  .st-body button, .st-body .st-actions{pointer-events:auto;}
  .st-body h1{font-size:2em; line-height:1.15; margin:0; letter-spacing:-.02em;}
  .st-body p{margin:0; font-size:1.05em; opacity:.92;}
  .st-eyebrow{text-transform:uppercase; letter-spacing:.12em; font-size:.72em; font-weight:800; opacity:.8;}
  .st-big{font-size:64px; line-height:1;}
  .st-small{font-size:.85em !important; opacity:.8 !important;}
  .st-score{display:flex; align-items:baseline; gap:8px; margin-top:8px;} .st-score b{font-size:3.2em; font-weight:800;} .st-score span{opacity:.85;}
  .st-rank{display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.14); border-radius:14px; padding:12px 14px;}
  .st-rank span{font-weight:800; opacity:.8; width:18px;} .st-rank b{flex:1;} .st-rank em{font-style:normal; font-weight:800;}
  .st-stack{display:flex; height:14px; border-radius:7px; overflow:hidden; gap:2px; margin-top:8px;}
  .st-card{background:rgba(255,255,255,.14); border-radius:16px; padding:14px 16px;} .st-card div{font-size:.8em; opacity:.85;} .st-card b{display:block; font-size:1.3em; margin:2px 0;}
  .st-pair{display:flex; gap:10px; flex-wrap:wrap;} .st-pair div{flex:1; min-width:140px; background:rgba(255,255,255,.14); border-radius:16px; padding:14px;} .st-pair b{display:block; font-size:1.5em;} .st-pair span{font-size:.82em; opacity:.85;}
  .st-actions{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .st-actions .btn.primary{background:#fff; color:#0f5c55;}
  .st-tap{position:absolute; top:60px; bottom:0; z-index:1;} .st-prev{left:0; width:35%;} .st-next{right:0; width:65%;}
  /* ---------- Easy-view recap ---------- */
  #story.easy .st-body{font-size:1.15em; gap:14px;}
  #story.easy .st-body h1{font-size:2.2em;}
  #story.easy .st-bars i.now b{animation:none; width:100%;}
  .ez-num{font-size:1.6em !important; font-weight:800; opacity:1 !important;}
  .ez-row{padding:16px 18px; font-size:1.1em;}
  .ez-btn{font-size:1.1em; padding:16px 20px;}
  .ez-nav{position:relative; z-index:3; display:flex; justify-content:space-between; gap:12px; max-width:520px; width:100%; margin:0 auto;}
  .ez-nav .btn{flex:1; background:rgba(255,255,255,.2); color:#fff;}
  /* ---------- First-run guide ---------- */
  #tour{position:fixed; inset:0; z-index:85; background:rgba(10,14,12,.55); display:flex; align-items:center; justify-content:center; padding:calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b)); overflow-y:auto;}
  .tour-card{background:var(--surface); width:100%; max-width:480px; max-height:100%; border-radius:24px; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; overflow:hidden; animation:up .3s;}
  .tour-top{display:flex; align-items:center; justify-content:space-between; padding:12px 12px 0 18px;}
  .tour-dots{display:flex; gap:5px;} .tour-dots i{width:7px; height:7px; border-radius:50%; background:var(--surface-3);} .tour-dots i.done{background:var(--accent-soft);} .tour-dots i.on{background:var(--accent); width:20px; border-radius:4px;}
  .tour-body{padding:6px 22px 14px; overflow-y:auto;}
  .tour-icon{font-size:46px; line-height:1; margin:6px 0 10px;}
  .tour-body h2{margin:0 0 8px; font-size:1.4em; letter-spacing:-.02em;}
  .tour-text{color:var(--ink-soft); margin-bottom:14px;}
  .tour-text .steps{margin-top:8px; color:var(--ink);}
  .tour-key{display:inline-block; padding:0 6px; border-radius:6px; background:var(--surface-2); color:var(--ink);}
  .tour-mock{background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:8px 10px;}
  .tour-opt{display:flex; gap:10px; align-items:flex-start; padding:12px; border:1.5px solid var(--line); border-radius:14px;}
  .tour-opt input{width:20px; height:20px; accent-color:var(--accent); margin-top:2px; flex-shrink:0;}
  .tour-opt:has(input:checked){border-color:var(--accent); background:var(--accent-soft);}
  .tour-ok{background:var(--accent-soft); border:none; color:var(--accent-strong); font-weight:650;}
  .tour-nav{display:flex; justify-content:space-between; gap:10px; padding:12px 18px calc(16px); border-top:1px solid var(--line);}
  .tour-nav .btn{min-width:110px;}
  body.simple .tour-body{font-size:1.05em;}
  body.simple .simple-hide{display:none !important;}
  body.simple .hero .big{font-size:2.8em;}
  body.simple .bar{height:14px;}
  body.simple .cat .top{flex-direction:column; align-items:flex-start; gap:2px;}
  body.simple .cat .name{white-space:normal;}
</style>
</head>
<body>
<div id="app">
  <div class="col">
    <header class="top">
      <span class="brand"><img src="icons/icon-192.png" alt="">Budgie</span>
      <button class="icon-btn" id="syncBtn" type="button" aria-label="Sync now" title="Sync" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>
        <span class="sync-dot" id="syncDot"></span>
      </button>
      <button class="icon-btn" data-tab="settings" type="button" aria-label="Settings">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>
    <div class="monthbar" id="monthbar">
      <button class="icon-btn" id="prevMonth" type="button" aria-label="Previous month"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="lbl"><b id="monthLabel">—</b><span id="monthSub"></span></div>
      <button class="icon-btn" id="nextMonth" type="button" aria-label="Next month"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>

    <main id="main">
      <section class="panel active" id="panel-home"></section>
      <section class="panel" id="panel-activity"></section>
      <section class="panel" id="panel-insights"></section>
      <section class="panel" id="panel-budget"></section>
      <section class="panel" id="panel-settings"></section>
    </main>
  </div>

  <nav class="tabbar">
    <div class="inner">
      <div class="side-brand"><img src="icons/icon-192.png" alt="">Budgie</div>
      <button class="tab-btn active" data-tab="home" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </button>
      <button class="tab-btn" data-tab="activity" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
        <span>Activity</span><span class="badge" id="navBadge" hidden></span>
      </button>
      <button class="add-btn" id="addBtn" type="button" aria-label="Add transaction">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab-btn simple-hide" data-tab="insights" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        <span>Insights</span>
      </button>
      <button class="tab-btn" data-tab="budget" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M7 3h10"/><circle cx="16.5" cy="15" r="1.3"/></svg>
        <span>Budget</span>
      </button>
    </div>
  </nav>
</div>

<div id="sheetWrap" hidden><div class="backdrop" data-close></div><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<div id="dropOverlay" hidden><div>📄 Drop your budget spreadsheet</div></div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.ods,.numbers,.pdf" hidden>
<div id="story" hidden role="dialog" aria-label="Month recap"></div>
<div id="tour" hidden></div>
<input type="file" id="backupInput" accept=".json,application/json" hidden>

<div id="installBanner" hidden>
  <div>
    <b>Add Budgie to your Home Screen</b>
    <p>Tap the Share icon in Safari, then “Add to Home Screen” — it opens full-screen like a real app.</p>
  </div>
  <button class="close" id="installClose" type="button" aria-label="Dismiss">&times;</button>
</div>

<script src="app.js"></script>
</body>
</html>
